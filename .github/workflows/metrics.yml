name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 프로필 카드
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: 2ee6e31a4e9b577e2be4573451e43f01
          filename: metrics.base.svg
          user: Hiyuuna
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Seoul
          repositories_forks: no
          repositories_affiliations: owner

      - name: 언어 통계
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: 2ee6e31a4e9b577e2be4573451e43f01
          filename: metrics.languages.svg
          user: Hiyuuna
          template: classic
          base: ""
          config_timezone: Asia/Seoul
          repositories_forks: no
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, tex, makefile, dockerfile, jupyter notebook

      - name: 3D 잔디
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: 2ee6e31a4e9b577e2be4573451e43f01
          filename: metrics.isocalendar.svg
          user: Hiyuuna
          template: classic
          base: ""
          config_timezone: Asia/Seoul
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: 연도별 잔디
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: 2ee6e31a4e9b577e2be4573451e43f01
          filename: metrics.calendar.svg
          user: Hiyuuna
          template: classic
          base: ""
          config_timezone: Asia/Seoul
          plugin_calendar: yes
          plugin_calendar_limit: 2

      - name: 코딩 습관
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: 2ee6e31a4e9b577e2be4573451e43f01
          filename: metrics.habits.svg
          user: Hiyuuna
          template: classic
          base: ""
          config_timezone: Asia/Seoul
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 30

      - name: 업적
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: 2ee6e31a4e9b577e2be4573451e43f01
          filename: metrics.achievements.svg
          user: Hiyuuna
          template: classic
          base: ""
          config_timezone: Asia/Seoul
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

      - name: 외부 기여
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: 2ee6e31a4e9b577e2be4573451e43f01
          filename: metrics.notable.svg
          user: Hiyuuna
          template: classic
          base: ""
          config_timezone: Asia/Seoul
          plugin_notable: yes

      - name: 이슈·PR 현황
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: 2ee6e31a4e9b577e2be4573451e43f01
          filename: metrics.followup.svg
          user: Hiyuuna
          template: classic
          base: ""
          config_timezone: Asia/Seoul
          plugin_followup: yes
          plugin_followup_sections: repositories, user

      - name: 코드 줄 수
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: 2ee6e31a4e9b577e2be4573451e43f01
          filename: metrics.lines.svg
          user: Hiyuuna
          template: classic
          base: ""
          config_timezone: Asia/Seoul
          repositories_forks: no
          repositories_affiliations: owner
          plugin_lines: yes

      - name: 최근 활동
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: gist
          committer_gist: 2ee6e31a4e9b577e2be4573451e43f01
          filename: metrics.activity.svg
          user: Hiyuuna
          template: classic
          base: ""
          config_timezone: Asia/Seoul
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_visibility: public
